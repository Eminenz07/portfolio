{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin Login | Portfolio</title>
<link rel="icon" href="{% static 'images/favicon.ico' %}"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #08090a; --surface: #191a1b; --fg: #f7f8f8; --fg-2: #d0d6e0;
  --meta: #62666d; --border: rgba(255, 255, 255, 0.08); --accent: #5e6ad2;
  --accent-hover: #828fff; --font-display: "Inter", sans-serif; --font-mono: "SF Mono", monospace;
  --radius-sm: 6px; --radius-lg: 12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-display);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{
  width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:32px;box-shadow:0 12px 36px rgba(0,0,0,0.5);
}
.login-header{margin-bottom:24px;text-align:center}
.login-brand{font-family:var(--font-mono);font-size:14px;color:var(--meta);margin-bottom:8px}
.login-title{font-size:24px;font-weight:600}
.field-group{margin-bottom:16px}
.field-label{display:block;font-family:var(--font-mono);font-size:12px;color:var(--meta);margin-bottom:6px}
.field-input{
  width:100%;background:rgba(255,255,255,.02);border:1px solid var(--border);
  border-radius:var(--radius-sm);color:var(--fg);font-size:14px;padding:12px;outline:none;
}
.field-input:focus{border-color:var(--accent)}
.btn-submit{
  width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:12px;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;transition:background .15s;
}
.btn-submit:hover{background:var(--accent-hover)}
.django-alert{padding:10px 14px;border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:12px;margin-bottom:16px;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);color:#f87171}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <div class="login-brand">eminence: ~/admin/login</div>
    <h1 class="login-title">Sign In</h1>
  </div>

  {% if messages %}
  {% for message in messages %}
  <div class="django-alert">{{ message }}</div>
  {% endfor %}
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="field-group">
      <label class="field-label" for="id_username">Username</label>
      {{ form.username }}
    </div>
    <div class="field-group">
      <label class="field-label" for="id_password">Password</label>
      {{ form.password }}
    </div>
    <button type="submit" class="btn-submit">Sign In →</button>
  </form>
</div>

</body>
</html>
